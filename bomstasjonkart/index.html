<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bomstasjonkart Norge</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f1720" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bomstasjoner" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Bomstasjoner i Norge</h1>
    <p>
      Alle <span id="antall-total">…</span> bomstasjoner, hentet direkte fra Statens vegvesens
      <a href="https://nvdb.no" target="_blank" rel="noopener">NVDB</a>. Data hentet <span id="hentet-dato"></span>.
    </p>
    <div class="filter">
      <label for="sok">Søk (navn / kommune / anlegg)</label>
      <input id="sok" type="search" placeholder="f.eks. Bergen, Fjellinjen, E39 …" />
      <span id="antall-vist"></span>
    </div>
  </header>

  <div id="kart"></div>
  <button id="finn-meg" title="Vis min posisjon" aria-label="Vis min posisjon">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" />
    </svg>
  </button>
  <div id="posisjon-melding" role="status"></div>

  <button id="rute-toggle" title="Planlegg rute">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M4 19L19 5M8 5h11v11" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    Rute
  </button>
  <div id="rute-instruks" role="status"></div>
  <div id="rute-panel"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
